version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lendenclub-mysql
    environment:
      MYSQL_DATABASE: lendenclub_db
      MYSQL_USER: lenden_user
      MYSQL_PASSWORD: lenden_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/2-sample-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: lendenclub-risk-engine
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/lendenclub_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: lenden_user
      DB_PASSWORD: lenden_pass
      AI_ENABLED: "false"
      OTP_MAX_RETRIES: 5
      OTP_RETRY_DELAY_MS: 2000
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  db_data:
