version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lendenclub-mysql
    environment:
      MYSQL_DATABASE: lendenclub_db
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/2-sample-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: lendenclub-risk-engine
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/lendenclub_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      BACKEND_AUTH_ENABLED: "true"
      BACKEND_API_KEY: ${BACKEND_API_KEY:?BACKEND_API_KEY is required}
      OTP_CREDENTIAL_ENCRYPTION_KEY: ${OTP_CREDENTIAL_ENCRYPTION_KEY:?OTP_CREDENTIAL_ENCRYPTION_KEY is required}
      AI_ENABLED: "false"
      OTP_MAX_RETRIES: 5
      OTP_RETRY_DELAY_MS: 2000
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  db_data:
