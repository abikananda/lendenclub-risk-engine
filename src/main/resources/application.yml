server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: lendenclub-risk-engine
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lendenclub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

backend:
  auth:
    enabled: ${BACKEND_AUTH_ENABLED:false}
    api-key: ${BACKEND_API_KEY:}
    header: ${BACKEND_AUTH_HEADER:X-API-Key}

risk-engine:
  version: ${RISK_ENGINE_VERSION:1.0.0}
  rules-version: ${RISK_RULES_VERSION:2026-08-28}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:noop}

npa-import:
  enabled: ${NPA_IMPORT_ENABLED:false}
  run-on-startup: ${NPA_IMPORT_RUN_ON_STARTUP:false}
  datasource:
    url: ${NPA_SOURCE_DB_URL:jdbc:mysql://localhost:3306/pfmp?useSSL=false&serverTimezone=Asia/Kolkata}
    username: ${NPA_SOURCE_DB_USERNAME:root}
    password: ${NPA_SOURCE_DB_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: ${NPA_SOURCE_DB_DRIVER:com.mysql.cj.jdbc.Driver}

otp:
  max-retries: ${OTP_MAX_RETRIES:5}
  retry-delay-ms: ${OTP_RETRY_DELAY_MS:2000}

gmail:
  username: ${GMAIL_USERNAME:placeholder-username}
  password: ${GMAIL_PASSWORD:placeholder-password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
