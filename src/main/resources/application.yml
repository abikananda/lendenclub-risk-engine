server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: lendenclub-risk-engine
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lendenclub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

risk-engine:
  version: ${RISK_ENGINE_VERSION:1.0.0}
  rules-version: ${RISK_RULES_VERSION:2026-08-28}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:noop}

otp:
  max-retries: ${OTP_MAX_RETRIES:5}
  retry-delay-ms: ${OTP_RETRY_DELAY_MS:2000}

gmail:
  username: ${GMAIL_USERNAME:placeholder-username}
  password: ${GMAIL_PASSWORD:placeholder-password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
