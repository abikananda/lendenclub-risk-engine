name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw -B verify
        if: ${{ hashFiles('mvnw') != '' }}

      - name: Run tests with Maven
        run: mvn -B verify
        if: ${{ hashFiles('mvnw') == '' }}
